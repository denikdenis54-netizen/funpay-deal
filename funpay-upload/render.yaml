services:
  - type: web
    name: funpay-deal
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: WEBAPP_URL
        sync: false
      - key: MANAGER_USERNAME
        sync: false
      - key: SUPPORT_USERNAME
        sync: false
      - key: ESCROW_PROVIDER
        value: mock
      - key: PORT
        value: 8080
      - key: LOG_LEVEL
        value: INFO