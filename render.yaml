services:
  - type: web
    name: funpay-deal
    runtime: docker
    plan: free
    region: frankfurt
  # Root Directory задаётся в настройках сервиса на Render,
  # здесь его дублировать нельзя — иначе путь станет
  # funpay-upload/funpay-upload и сборка не найдёт Dockerfile.
  # PORT тоже не задаём: Render подставляет свой.
  dockerfilePath: ./Dockerfile
  healthCheckPath: /health
  envVars:
    - key: BOT_TOKEN
      sync: false
    - key: WEBAPP_URL
      sync: false
    - key: MANAGER_USERNAME
      sync: false
    - key: SUPPORT_USERNAME
      sync: false
    - key: ESCROW_PROVIDER
      value: mock
    - key: LOG_LEVEL
      value: INFO